<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اطلب تصميمك — Mo Albera</title>
<meta name="description" content="اطلب شعار، هوية بصرية، تصاميم سوشيال ميديا، أو تصاميم فعالية.">
<meta property="og:image" content="https://moalbera.github.io/work/fb2.jpg">
<script>window.DATA_P=fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json());</script>
<link rel="preload" as="image" href="work/bg.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="style.css?v=1795263093">
</head>
<body class="order-page">
<div class="bg" aria-hidden="true"></div>

<nav id="nav">
  <div class="nav-in glass">
    <a href="./" class="logo"><i class="av"><img src="work/avatar.webp" alt="" width="38" height="38"></i><span data-t="site.name">Mo Albera</span></a>
    <div class="links">
      <a href="./#work">الأعمال</a>
      <a href="./#services">الخدمات</a>
      <a href="./#about">عني</a>
      <a href="./#contact">تواصل</a>
    </div>
    <a href="./#work" class="btn btn-glass nav-cta">شوف أعمالي</a>
    <button class="menu-btn" aria-label="القائمة" onclick="document.getElementById('nav').classList.toggle('open')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16M4 16h16"/></svg>
    </button>
  </div>
</nav>

<main>
  <div class="wrap od">
    <header class="od-head">
      <span class="pill glass">طلب تصميم</span>
      <h1 id="odTitle">شن تبي نصمملك؟</h1>
      <p class="sub" id="odSub">اختار نوع الطلب وجاوب على كم سؤال. ياخذ دقيقتين، ونرجعلك في أقرب وقت.</p>
    </header>

    <div class="od-types" id="types"></div>

    <form class="od-form" id="form" hidden novalidate>
      <button type="button" class="od-back" id="back">→ بدّل نوع الطلب</button>
      <div id="fields"></div>
      <input type="text" name="_honey" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
      <div class="od-err" id="err" hidden></div>
      <div class="od-submit">
        <button class="btn btn-white" type="submit" id="send">ابعت الطلب</button>
        <span class="hint">المعلومات توصلني أنا بس، وما تنشرش.</span>
      </div>
    </form>

    <div class="od-done glass" id="done" hidden>
      <div class="ok">✓</div>
      <h2>شكراً لثقتك!</h2>
      <p>نراجع التفاصيل ونتواصل معاك على رقمك في أقرب وقت.</p>
      <div class="cta-row">
        <a class="btn btn-white" id="waNext" target="_blank" rel="noopener">لو مستعجل، كمّل على واتساب</a>
        <a class="btn btn-glass" href="./">ارجع للموقع</a>
      </div>
    </div>
  </div>

  <footer>
    <div class="foot-line">
      <span>© <span id="yr"></span> <span data-t="site.name"></span></span><i></i>
      <span data-t="site.footerText"></span>
    </div>
    <div class="ghost" aria-hidden="true" data-t="site.ghostWord"></div>
  </footer>
</main>

<script src="app.js?v=1795263093"></script>
<script src="order.js?v=1795263093"></script>
</body>
</html>
