<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mo Albera — مصمم جرافيك</title>
<meta name="description" content="محمد البيرة — مصمم جرافيك من مصراتة، ليبيا. هوية بصرية، شعارات، تصاميم سوشيال ميديا وتصاميم إبداعية.">
<meta property="og:title" content="Mo Albera — مصمم جرافيك">
<meta property="og:description" content="تصاميم تتكلّم أعلى من الكلام. هوية بصرية، شعارات، سوشيال ميديا وتصاميم إبداعية.">
<meta property="og:image" content="https://moalbera.github.io/work/fb2.jpg">
<script>window.DATA_P=fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json());</script>
<link rel="preload" as="image" href="work/bg.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1795188675">
<style>body.loading main{opacity:0}main{transition:opacity .5s}</style>
</head>
<body class="loading">

<div class="bg" aria-hidden="true"></div>

<nav id="nav">
  <div class="nav-in glass">
    <a href="#top" class="logo"><i data-t="initial">M</i><span data-t="site.name">Mo Albera</span></a>
    <div class="links">
      <a href="#work">الأعمال</a>
      <a href="#videos">فيديوهات</a>
      <a href="#services">الخدمات</a>
      <a href="#about">عني</a>
      <a href="#contact">تواصل</a>
    </div>
    <a href="#contact" class="btn btn-white nav-cta" data-t="site.ctaOrder"></a>
    <button class="menu-btn" aria-label="القائمة" onclick="document.getElementById('nav').classList.toggle('open')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16M4 16h16"/></svg>
    </button>
  </div>
</nav>

<main>
<header class="hero" id="top">
  <div class="wrap" style="display:flex;flex-direction:column;align-items:center">
    <span class="pill glass rv" id="statusPill" hidden><span class="dot"></span><span data-t="site.status"></span></span>
    <h1 class="rv"><span class="ltr" data-t="site.name"></span></h1>
    <div class="hero-card glass rv">
      <h2 data-t="site.headline"></h2>
      <p data-t="site.intro"></p>
      <div class="cta-row">
        <a href="#work" class="btn btn-glass" data-t="site.ctaWork"></a>
        <a target="_blank" rel="noopener" class="btn btn-white wa-link" data-t="site.ctaOrder"></a>
      </div>
    </div>
    <div class="socials rv" id="socials"></div>
  </div>
</header>

<div class="marq" id="marq" aria-hidden="true"></div>

<section id="stats" style="padding:70px 0 20px">
  <div class="wrap"><div class="stats" id="statsBox"></div></div>
</section>

<section id="work">
  <div class="wrap">
    <div class="head rv">
      <span class="pill glass">Selected Work</span>
      <h2 data-t="site.workTitle"></h2>
      <p data-t="site.workIntro"></p>
      <div class="cat-nav" id="catNav"></div>
    </div>
    <div id="featuredBox"></div>
    <div id="cats"></div>
  </div>
</section>

<section id="videos" style="display:none">
  <div class="wrap">
    <div class="head rv">
      <span class="pill glass">Videos</span>
      <h2 id="vTitle"></h2>
      <p id="vIntro"></p>
    </div>
    <div class="vids" id="vids"></div>
    <div class="vids-nav"><button class="ib glass icon-btn" style="width:46px;height:46px" onclick="document.getElementById('vids').scrollBy({left:300,behavior:'smooth'})">›</button><button class="ib glass icon-btn" style="width:46px;height:46px" onclick="document.getElementById('vids').scrollBy({left:-300,behavior:'smooth'})">‹</button></div>
  </div>
</section>

<section id="services">
  <div class="wrap">
    <div class="head rv">
      <span class="pill glass">Services</span>
      <h2>شنو نقدّم لك</h2>
      <p data-t="servicesIntro"></p>
    </div>
    <div class="services" id="servicesList"></div>
  </div>
</section>

<section id="process">
  <div class="wrap">
    <div class="head rv"><span class="pill glass">Process</span><h2>كيف نشتغلوا</h2></div>
    <div class="steps" id="stepsList"></div>
  </div>
</section>

<section id="about">
  <div class="wrap">
    <div class="about glass rv" id="aboutBox">
      <div class="me" id="me" hidden><img alt="" loading="lazy" decoding="async" width="765" height="1300"></div>
      <div class="me-txt">
        <div>
          <span class="pill glass" style="margin-bottom:22px">About</span>
          <p class="big" id="aboutText"></p>
        </div>
        <div>
          <span class="lbl" data-t="about.brandsLabel"></span>
          <div class="brands" id="brands"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <div class="wrap">
    <div class="hero-card glass rv">
      <span class="pill glass" style="margin-bottom:24px"><span class="dot"></span>Let's work together</span>
      <h2 data-t="contact.title"></h2>
      <p data-t="contact.text"></p>
      <div class="cta-row">
        <a class="btn btn-glass mail-link"><span class="ltr" data-t="contact.email"></span></a>
        <a target="_blank" rel="noopener" class="btn btn-white wa-link">واتساب <span class="ltr" data-t="contact.phoneDisplay"></span></a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="foot-line">
    <span>© <span id="yr"></span> <span data-t="site.name"></span></span><i></i>
    <span data-t="site.footerText"></span><i></i>
    <a class="be-link" target="_blank" rel="noopener">Behance</a>
  </div>
  <div class="ghost" aria-hidden="true" data-t="site.ghostWord"></div>
</footer>
</main>

<a class="wa glass wa-link" target="_blank" rel="noopener" aria-label="واتساب"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.7.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg></a>

<script src="app.js?v=1795188675"></script>
<script>
function render(D){
  fillCommon(D);
  document.title=D.site.name+' — مصمم جرافيك';
  const cats=(D.categories||[]).filter(c=>c.projects&&c.projects.length);
  const all=allProjects(D);
  let nav='';

  // المشروع المميز
  const F=D.featured||{}, fp=all.find(p=>p.id===F.projectId), fb=document.getElementById('featuredBox');
  if(F.show&&fp){
    nav+=`<a class="glass" href="#featured">مشروع مميز<b>${esc(yearOf(fp.date))}</b></a>`;
    const g=(fp.gallery||[]).slice(0,4);
    fb.innerHTML=`<a class="feature glass rv" id="featured" href="${projUrl(fp)}">
      <div class="feature-top">
        <div class="feature-img"><img src="${esc(fp.cover)}" alt="${esc(fp.title)}" loading="lazy"></div>
        <div class="feature-txt">
          <div class="meta">${F.label?`<span class="tag hot">${esc(F.label)} · ${esc(yearOf(fp.date))}</span>`:''}${F.tag?`<span class="tag">${esc(F.tag)}</span>`:''}</div>
          <h3><span class="ltr">${esc(fp.title)}</span>${fp.subtitle?`<br>${esc(fp.subtitle)}`:''}</h3>
          <p>${esc((fp.desc||'').split('\n')[0])}</p>
          <span class="btn btn-white" style="margin-top:24px">شوف المشروع كامل</span>
        </div>
      </div>
      ${g.length?`<div class="feature-grid">${g.map(x=>`<div><img src="${esc(tOf(x))}" alt="" loading="lazy" decoding="async"></div>`).join('')}</div>`:''}
    </a>`;
  } else fb.innerHTML='';

  // الأقسام: مربعات، كل مربع يفتح صفحة المشروع
  document.getElementById('cats').innerHTML=cats.map((c,ci)=>{
    nav+=`<a class="glass" href="#cat${ci}">${esc(c.title)}<b>${c.projects.length}</b></a>`;
    const n=String(ci+1).padStart(2,'0'), tot=String(cats.length).padStart(2,'0');
    return `<div class="cat" id="cat${ci}">
      <div class="cat-head rv"><div><span class="num ltr">${n} / ${tot}</span><h3>${esc(c.title)}${c.en?`<small class="ltr">${esc(c.en)}</small>`:''}</h3></div><p>${esc(c.desc)}</p></div>
      <div class="grid sq">${c.projects.map(p=>projectCard({...p})).join('')}</div></div>`;
  }).join('');
  document.getElementById('catNav').innerHTML=nav;

  // شريط الأعمال المتحرك
  const covers=all.filter(p=>p.cover); const half=Math.ceil(covers.length/2);
  const row=(arr,rev)=>`<div class="marq-row${rev?' rev':''}">${[...arr,...arr].map(p=>`<a href="${projUrl(p)}" tabindex="-1"><img src="${esc(p.thumb||p.cover)}" alt="" loading="lazy" decoding="async"></a>`).join('')}</div>`;
  document.getElementById('marq').innerHTML=covers.length?row(covers.slice(0,half))+row(covers.slice(half),1):'';

  // الأرقام
  const V=D.videos||{}, vids=(V.show&&V.items)||[];
  const years=new Date().getFullYear()-Math.min(...all.map(p=>+yearOf(p.date)||9999));
  const views=vids.reduce((a,v)=>a+parseViews(v.views),0);
  const st=[[all.length,'+','مشروع منشور'],[cats.length,'','أقسام تصميم'],[years>0?years:1,'+','سنين خبرة']];
  if(views) st.push([Math.round(views/1000),'K+','مشاهدة للفيديوهات']);
  document.getElementById('statsBox').innerHTML=st.map(([n,suf,l])=>`<div class="stat glass spot rv"><b data-to="${n}" data-suf="${suf}">0</b><span>${l}</span></div>`).join('');

  // الفيديوهات
  const vs=document.getElementById('videos');
  if(vids.length){vs.style.display='';document.getElementById('vTitle').textContent=V.title||'فيديوهاتي';document.getElementById('vIntro').textContent=V.intro||'';
    document.getElementById('vids').innerHTML=vids.map(videoCard).join('');}
  else vs.style.display='none';

  document.getElementById('servicesList').innerHTML=(D.services||[]).map((s,i)=>
    `<div class="svc glass spot rv"><div class="ic glass">${String(i+1).padStart(2,'0')}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('');
  document.getElementById('stepsList').innerHTML=(D.steps||[]).map((s,i)=>
    `<div class="step glass spot rv"><b>${String(i+1).padStart(2,'0')}</b><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('');
  document.getElementById('aboutText').innerHTML=esc(D.about.text).replace(/\[\[(.+?)\]\]/g,'<em>$1</em>');
  if(D.about.photo){const m=document.getElementById('me');m.hidden=false;const im=m.querySelector('img');im.src=D.about.photo;im.alt=D.site.name;document.getElementById('aboutBox').classList.add('has-me');}
  document.getElementById('statusPill').hidden=!(D.site.status||'').trim();
  document.getElementById('brands').innerHTML=(D.about.brands||[]).map(b=>`<span>${esc(b)}</span>`).join('');
}
loadData().then(D=>{
  render(D); document.body.classList.remove('loading');
  splitText(document.querySelector('.hero h1 .ltr'));
  document.querySelectorAll('.hero-card,.feature,.about,.contact .hero-card').forEach(b=>b.classList.add('spot'));
    stagger(); reveal(); counters(); motion();
  if(location.hash){const t=document.querySelector(location.hash); t&&t.scrollIntoView();}
}).catch(()=>{document.body.classList.remove('loading');document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));});
</script>
</body>
</html>
