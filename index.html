<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mo Albera — مصمم جرافيك</title>
<meta name="description" content="محمد البيرة — مصمم جرافيك من مصراتة، ليبيا. هوية بصرية، شعارات، تصاميم سوشيال ميديا وتصاميم إبداعية.">
<meta property="og:title" content="Mo Albera — مصمم جرافيك">
<meta property="og:description" content="تصاميم تتكلّم أعلى من الكلام. هوية بصرية، شعارات، سوشيال ميديا وتصاميم إبداعية.">
<meta property="og:image" content="https://moalbera.github.io/work/fb2.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>body.loading main{opacity:0}main{transition:opacity .5s}</style>
</head>
<body class="loading">

<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
      <filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
      <linearGradient id="go" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a1a" stop-opacity="0"/><stop offset=".5" stop-color="#ff8a2a"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></linearGradient>
      <linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fb3d9" stop-opacity="0"/><stop offset=".5" stop-color="#c9d6ee"/><stop offset="1" stop-color="#5b6c8e" stop-opacity="0"/></linearGradient>
    </defs>
    <g class="spin2"><ellipse cx="500" cy="500" rx="330" ry="150" fill="#1b2235" filter="url(#b3)" opacity=".9" transform="rotate(-18 500 500)"/></g>
    <g class="spin">
      <path d="M170 560 C 300 380, 520 330, 700 420 S 880 600, 760 640" fill="none" stroke="url(#gs)" stroke-width="70" filter="url(#b1)" opacity=".55"/>
      <path d="M220 600 C 360 430, 560 380, 720 450 S 860 590, 800 620" fill="none" stroke="url(#go)" stroke-width="10" filter="url(#b2)" opacity=".95"/>
      <path d="M260 470 C 420 360, 600 360, 760 480" fill="none" stroke="url(#go)" stroke-width="26" filter="url(#b1)" opacity=".7"/>
      <path d="M330 640 C 470 560, 640 560, 820 520" fill="none" stroke="url(#go)" stroke-width="4" filter="url(#b2)" opacity=".8"/>
      <path d="M380 380 C 470 330, 560 330, 640 370" fill="none" stroke="url(#gs)" stroke-width="40" filter="url(#b1)" opacity=".6"/>
    </g>
  </svg>
</div>
<div class="noise" aria-hidden="true"></div>

<nav id="nav">
  <div class="nav-in glass">
    <a href="#top" class="logo"><i data-t="initial">M</i><span data-t="site.name">Mo Albera</span></a>
    <div class="links">
      <a href="#work">الأعمال</a>
      <a href="#services">الخدمات</a>
      <a href="#about">عني</a>
      <a href="#contact">تواصل</a>
    </div>
    <a href="#contact" class="btn btn-white nav-cta" data-t="site.ctaOrder"></a>
    <button class="menu-btn" aria-label="القائمة" onclick="document.getElementById('nav').classList.toggle('open')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16M4 16h16"/></svg>
    </button>
  </div>
</nav>

<main>
<header class="hero" id="top">
  <div class="wrap" style="display:flex;flex-direction:column;align-items:center">
    <span class="pill glass rv"><span class="dot"></span><span data-t="site.status"></span></span>
    <h1 class="rv"><span class="ltr" data-t="site.name"></span></h1>
    <div class="hero-card glass rv">
      <h2 data-t="site.headline"></h2>
      <p data-t="site.intro"></p>
      <div class="cta-row">
        <a href="#work" class="btn btn-glass" data-t="site.ctaWork"></a>
        <a target="_blank" rel="noopener" class="btn btn-white wa-link" data-t="site.ctaOrder"></a>
      </div>
    </div>
    <div class="socials rv" id="socials"></div>
  </div>
</header>

<section id="work">
  <div class="wrap">
    <div class="head rv">
      <span class="pill glass">Selected Work</span>
      <h2 data-t="site.workTitle"></h2>
      <p data-t="site.workIntro"></p>
      <div class="cat-nav" id="catNav"></div>
    </div>
    <div id="featuredBox"></div>
    <div id="cats"></div>
  </div>
</section>

<section id="services">
  <div class="wrap">
    <div class="head rv">
      <span class="pill glass">Services</span>
      <h2>شنو نقدّم لك</h2>
      <p data-t="servicesIntro"></p>
    </div>
    <div class="services" id="servicesList"></div>
  </div>
</section>

<section id="process">
  <div class="wrap">
    <div class="head rv"><span class="pill glass">Process</span><h2>كيف نشتغلوا</h2></div>
    <div class="steps" id="stepsList"></div>
  </div>
</section>

<section id="about">
  <div class="wrap">
    <div class="about glass rv">
      <div>
        <span class="pill glass" style="margin-bottom:22px">About</span>
        <p class="big" id="aboutText"></p>
      </div>
      <div>
        <span class="lbl" data-t="about.brandsLabel"></span>
        <div class="brands" id="brands"></div>
      </div>
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <div class="wrap">
    <div class="hero-card glass rv">
      <span class="pill glass" style="margin-bottom:24px"><span class="dot"></span>Let's work together</span>
      <h2 data-t="contact.title"></h2>
      <p data-t="contact.text"></p>
      <div class="cta-row">
        <a class="btn btn-glass" id="mailBtn"><span class="ltr" data-t="contact.email"></span></a>
        <a target="_blank" rel="noopener" class="btn btn-white wa-link">واتساب <span class="ltr" data-t="contact.phoneDisplay"></span></a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="foot-line">
    <span>© <span id="yr"></span> <span data-t="site.name"></span></span><i></i>
    <span data-t="site.footerText"></span><i></i>
    <a id="footBe" target="_blank" rel="noopener">Behance</a>
  </div>
  <div class="ghost" aria-hidden="true" data-t="site.ghostWord"></div>
</footer>
</main>

<a class="wa glass wa-link" target="_blank" rel="noopener" aria-label="واتساب"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.7.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg></a>

<div class="lb" id="lb">
  <button class="x glass" aria-label="إغلاق">✕</button>
  <button class="prev glass" aria-label="السابق">›</button>
  <button class="next glass" aria-label="التالي">‹</button>
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div>
</div>

<script>
const ICONS={
 behance:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.2 11.3c.8-.4 1.3-1.1 1.3-2.1C9.5 7.1 7.9 6.5 6 6.5H1v11h5.2c2 0 3.8-.9 3.8-3.1 0-1.4-.7-2.5-1.8-3.1zM3.3 8.4h2.2c.8 0 1.6.2 1.6 1.2 0 .9-.6 1.2-1.4 1.2H3.3V8.4zm2.5 7.2H3.3v-3h2.6c1 0 1.7.4 1.7 1.5s-.8 1.5-1.8 1.5zM15.4 9.2c-2.5 0-4.1 1.8-4.1 4.2 0 2.5 1.5 4.2 4.1 4.2 1.9 0 3.2-.9 3.8-2.8h-2c-.2.7-1.1 1-1.7 1-1.3 0-2-.7-2-2h5.8c.1-2.6-1.3-4.6-3.9-4.6zm-1.9 3.4c.1-1.1.8-1.7 1.8-1.7 1.1 0 1.6.6 1.7 1.7h-3.5zM13.6 6.9h4.5v1.3h-4.5z"/></svg>',
 facebook:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8.5V6.8c0-.8.2-1.3 1.4-1.3H17V2.6c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1v1.9H8v3.2h2.6V22H14v-10.3h2.7l.4-3.2H14z"/></svg>',
 instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>'
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
let ALL=[];

function render(D){
  document.querySelectorAll('[data-t]').forEach(el=>{
    const k=el.dataset.t; el.textContent = k==='initial' ? (D.site.name||'M').trim()[0] : (get(D,k)??'');
  });
  document.title=D.site.name+' — مصمم جرافيك';
  const C=D.contact;
  document.querySelectorAll('.wa-link').forEach(a=>a.href='https://wa.me/'+String(C.whatsapp).replace(/\D/g,''));
  document.getElementById('mailBtn').href='mailto:'+C.email;
  document.getElementById('footBe').href=C.behance||'#';
  document.getElementById('socials').innerHTML=['behance','facebook','instagram'].filter(k=>C[k]).map(k=>
    `<a class="icon-btn glass" href="${esc(C[k])}" target="_blank" rel="noopener" aria-label="${k}">${ICONS[k]}</a>`).join('');

  // featured
  const F=D.featured, fb=document.getElementById('featuredBox');
  const cats=(D.categories||[]).filter(c=>c.items&&c.items.length);
  let nav='';
  if(F&&F.show){
    nav+=`<a class="glass" href="#featured">مشروع مميز<b>${esc(F.year)}</b></a>`;
    const fl=[{img:F.cover,cap:F.title+' — '+F.subtitle+' · '+F.year},...(F.gallery||[]).map(g=>({img:g.img,cap:F.title+' — '+g.caption}))];
    fb.innerHTML=`<div class="feature glass rv" id="featured">
      <div class="feature-top">
        <div class="feature-img" data-f="0"><img src="${esc(F.cover)}" alt="${esc(F.title)}" loading="lazy"></div>
        <div class="feature-txt">
          <div class="meta">${F.label?`<span class="tag hot">${esc(F.label)} · ${esc(F.year)}</span>`:''}${F.tag?`<span class="tag">${esc(F.tag)}</span>`:''}</div>
          <h3><span class="ltr">${esc(F.title)}</span><br>${esc(F.subtitle)}</h3>
          <p>${esc(F.text)}</p>
        </div>
      </div>
      ${(F.gallery||[]).length?`<div class="feature-grid">${F.gallery.map((g,i)=>`<div data-f="${i+1}"><img src="${esc(g.img)}" alt="${esc(g.caption)}" loading="lazy"></div>`).join('')}</div>`:''}
    </div>`;
    fb.querySelectorAll('[data-f]').forEach(el=>el.onclick=()=>open(fl.map(x=>({img:x.img,t:x.cap})),+el.dataset.f));
  } else fb.innerHTML='';

  // categories
  ALL=[];
  document.getElementById('cats').innerHTML=cats.map((c,ci)=>{
    nav+=`<a class="glass" href="#cat${ci}">${esc(c.title)}<b>${c.items.length}</b></a>`;
    const years=new Set(c.items.map(x=>x.year)).size; let last=null;
    const cards=c.items.map(w=>{
      const i=ALL.push({img:w.img,t:w.title+(w.year?' · '+w.year:''),l:w.link,c:ci})-1;
      const div=(years>1&&w.year!==last)?`<div class="yr-divider">${esc(w.year)}</div>`:''; last=w.year;
      return div+`<article class="card glass rv" data-i="${i}">
        <div class="ph"><img src="${esc(w.img)}" alt="${esc(w.title)}" loading="lazy"></div>
        <div class="cap"><h4>${esc(w.title)}</h4>${w.year?`<span class="yr">${esc(w.year)}</span>`:''}</div></article>`;}).join('');
    const n=String(ci+1).padStart(2,'0'), tot=String(cats.length).padStart(2,'0');
    return `<div class="cat" id="cat${ci}">
      <div class="cat-head rv"><div><span class="num ltr">${n} / ${tot}</span><h3>${esc(c.title)}${c.en?`<small class="ltr">${esc(c.en)}</small>`:''}</h3></div><p>${esc(c.desc)}</p></div>
      <div class="grid">${cards}</div></div>`;
  }).join('');
  document.getElementById('catNav').innerHTML=nav;

  document.getElementById('servicesList').innerHTML=(D.services||[]).map((s,i)=>
    `<div class="svc glass rv"><div class="ic glass">${String(i+1).padStart(2,'0')}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('');
  document.getElementById('stepsList').innerHTML=(D.steps||[]).map((s,i)=>
    `<div class="step glass rv"><b>${String(i+1).padStart(2,'0')}</b><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('');
  document.getElementById('aboutText').innerHTML=esc(D.about.text).replace(/\[\[(.+?)\]\]/g,'<em>$1</em>');
  document.getElementById('brands').innerHTML=(D.about.brands||[]).map(b=>`<span>${esc(b)}</span>`).join('');
}

// lightbox
let list=[],idx=0;
const lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbCap=document.getElementById('lbCap');
function show(){const x=list[idx];lbImg.src=x.img;lbCap.innerHTML=esc(x.t)+(x.l?`<a href="${esc(x.l)}" target="_blank" rel="noopener">شوف المشروع كامل</a>`:'');}
function open(l,i){list=l;idx=i;show();lb.classList.add('open');document.body.style.overflow='hidden';}
function close(){lb.classList.remove('open');document.body.style.overflow='';}
document.getElementById('cats').addEventListener('click',e=>{const it=e.target.closest('.card');if(!it)return;
  const me=ALL[it.dataset.i]; const same=ALL.filter(a=>a.c===me.c); open(same,same.indexOf(me));});
lb.querySelector('.x').onclick=close;
lb.querySelector('.next').onclick=e=>{e.stopPropagation();idx=(idx+1)%list.length;show();};
lb.querySelector('.prev').onclick=e=>{e.stopPropagation();idx=(idx-1+list.length)%list.length;show();};
lb.addEventListener('click',e=>{if(e.target===lb)close();});
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')close();
  if(e.key==='ArrowLeft')lb.querySelector('.next').click();
  if(e.key==='ArrowRight')lb.querySelector('.prev').click();});

document.querySelectorAll('.links a').forEach(a=>a.onclick=()=>document.getElementById('nav').classList.remove('open'));
document.getElementById('yr').textContent=new Date().getFullYear();

fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(D=>{
  render(D);
  document.body.classList.remove('loading');
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}}),{threshold:.1});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
  if(location.hash){const t=document.querySelector(location.hash); t&&t.scrollIntoView();}
}).catch(()=>{document.body.classList.remove('loading');document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));});
</script>
</body>
</html>
